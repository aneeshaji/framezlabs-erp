name: Deploy to cPanel — erp.framezlabs.store

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:

  # ══════════════════════════════════════════════════════════
  #  JOB 1 — Build React/Vite frontend
  #  Deploys to: erp.framezlabs.store/public/
  #  (index.html + assets/ sit alongside Laravel index.php)
  # ══════════════════════════════════════════════════════════
  deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: client
        # Delete the Windows-generated lockfile so npm resolves Linux-specific
        # optional deps (e.g. @rollup/rollup-linux-x64-gnu) from scratch.
        run: |
          rm -f package-lock.json
          npm install

      - name: Build frontend
        working-directory: client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # client/dist/ contents go into the Laravel public/ folder
      # so React index.html lives alongside Laravel index.php
      - name: FTP Deploy → erp.framezlabs.store/public/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: client/dist/
          server-dir: erp.framezlabs.store/public/
          exclude: |
            **/.git*
            **/.git*/**

  # ══════════════════════════════════════════════════════════
  #  JOB 2 — Deploy Laravel backend (server-laravel/)
  #  Deploys to: erp.framezlabs.store/   (the Laravel root)
  #  Skips: .env, storage cache, tests, node_modules
  # ══════════════════════════════════════════════════════════
  deploy-backend:
    name: Build and Deploy Laravel Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, xml, curl, zip, bcmath
          tools: composer:v2

      - name: Install Composer dependencies (no dev)
        working-directory: server-laravel
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

      # server-laravel/ contents go into erp.framezlabs.store/ root
      # .env is excluded — it already exists on cPanel and must not be overwritten
      - name: FTP Deploy → erp.framezlabs.store/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: server-laravel/
          server-dir: erp.framezlabs.store/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/tests/**

  # ══════════════════════════════════════════════════════════
  #  JOB 3 — Post-deploy: SSH into cPanel & run artisan
  #  Runs after BOTH FTP jobs complete successfully
  # ══════════════════════════════════════════════════════════
  post-deploy:
    name: Post-Deploy Artisan Tasks
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]

    steps:
      - name: SSH — clear caches, cache config, run migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/erp.framezlabs.store

            # Clear stale caches before re-caching
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan cache:clear

            # Re-build optimized caches for production
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Run any pending migrations safely
            php artisan migrate --force

            echo "Deployment complete — $(date)"
