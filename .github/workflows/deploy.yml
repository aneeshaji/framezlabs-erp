name: Deploy to cPanel — erp.framezlabs.store

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:

  # ══════════════════════════════════════════════════════════
  #  JOB 1 — Build React/Vite frontend
  #  Deploys: client/dist/ → erp.framezlabs.store/public/
  # ══════════════════════════════════════════════════════════
  deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: client
        # Delete Windows lockfile so Linux optional deps (rollup native) resolve fresh
        run: |
          rm -f package-lock.json
          npm install

      - name: Build frontend
        working-directory: client
        # Vite automatically loads .env.production during build
        # (no need to inject VITE_API_URL as a secret — .env.production has the correct URL)
        run: npm run build

      - name: FTP Deploy → erp.framezlabs.store/public/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: client/dist/
          server-dir: erp.framezlabs.store/public/
          exclude: |
            **/.git*
            **/.git*/**

  # ══════════════════════════════════════════════════════════
  #  JOB 2 — Deploy Laravel source files only (NO vendor/)
  #  Deploys: server-laravel/ → erp.framezlabs.store/
  #
  #  vendor/ is intentionally excluded from FTP — uploading
  #  thousands of files over FTP causes timeouts. Instead,
  #  composer install runs on the server in the post-deploy
  #  SSH step (Job 3) which is much faster.
  # ══════════════════════════════════════════════════════════
  deploy-backend:
    name: Deploy Laravel Source Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: FTP Deploy → erp.framezlabs.store/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: server-laravel/
          server-dir: erp.framezlabs.store/
          exclude: |
            **/.git*
            **/.git*/**
            **/vendor/**
            **/node_modules/**
            **/.env
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/tests/**

  # ══════════════════════════════════════════════════════════
  #  JOB 3 — Post-deploy via SSH
  #  Runs after BOTH FTP jobs succeed.
  #  Installs composer deps on the server (avoids FTP timeout),
  #  then clears & rebuilds all Laravel caches + migrations.
  # ══════════════════════════════════════════════════════════
  post-deploy:
    name: Post-Deploy Tasks (SSH)
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]

    steps:
      - name: Check SSH secrets are configured
        id: check-ssh
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "SSH_HOST secret not set — skipping post-deploy SSH tasks."
            echo "Please add SSH_HOST, SSH_USERNAME, SSH_PASSWORD, SSH_PORT"
            echo "to GitHub → Settings → Secrets → Actions"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: SSH — composer install + artisan cache + migrate
        if: steps.check-ssh.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 10m
          script: |
            cd ~/erp.framezlabs.store

            # Install/update composer dependencies on the server
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # Clear stale caches
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan cache:clear

            # Rebuild optimized caches for production
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Run any pending migrations
            php artisan migrate --force

            echo "Deployment complete — $(date)"
